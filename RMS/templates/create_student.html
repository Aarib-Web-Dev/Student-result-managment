{% extends "admin_base.html" %}
{% load static %}

{% block main %}
<div class="container">
    <h2 class="mb-4"><i class="fa fa-user-graduate text-info"></i> Add Student</h2>

    {% if messages %}
        {% for m in messages %}
            <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags }}{% endif %} alert-dismissible fade show" role="alert">
                {{ m }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form action="" method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required placeholder="Enter student name">
        </div>

        <div class="mb-3">
            <label for="roll_id" class="form-label">Roll ID</label>
            <input type="text" class="form-control" id="roll_id" name="roll_id" required placeholder="Enter roll ID">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="Enter email">
        </div>

        <div class="mb-3">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-select" id="gender" name="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Custom">Custom</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="dob" class="form-label">Date of Birth</label>
            <input type="text" class="form-control" id="dob" name="dob" required placeholder="Enter date of birth">
        </div>

        <div class="mb-3">
            <label for="student_class" class="form-label">Class</label>
            <select class="form-select" id="student_class" name="student_class" required>
                <option value="">Select class</option>
                {% for c in classes %}
                    <option value="{{ c.id }}">{{ c.class_name }} - {{ c.section }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-info"><i class="fa-regular fa-circle-check me-2"></i>Submit</button>
    </form>
</div>
{% endblock main %}
