 {% extends 'base.html' %}

 {%block content%}
 <div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow" >
                <div class="card-header bg-black text-white text-center">
                    <h4><i class="fas fa-user-shield"></i> Admin Login</h4></div>
                    <div class="card-body py-4">
                        {% if error%}
                        <div class="alert alert-danger text-center">
                            {{error}}
                        </div>
                        {% endif %}
                        <form action="" method="post" autocomplete="off">
                          {% csrf_token %}
                           <div class="mb-3">
                             <label for="username" class="form-label"><i class="fa fa-user"></i>UserName </label>
                            <input type="text" class="form-control" placeholder="Enter your username" name="username" id="username" required  autocomplete="off">
                           </div>

                           <div class="mb-3">
                             <label for="password" class="form-label"><i class="fa fa-user"></i>Password </label>
                            <input type="password" class="form-control" placeholder="Enter your password" name="password" id="password" required autocomplete="new-password">
                           </div>
                           <button class="btn btn-info w-100    " type="submit"><i class="fa fa-sign-in-alt me-2"></i>Login</button>
                        </form>
                    </div>
            </div>
        </div>

    </div>
 </div>
 {% endblock content%}
